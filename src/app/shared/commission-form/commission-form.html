<form class="card form" [formGroup]="form" (ngSubmit)="submit()">
  @if (commission()) {
    <h3 class="form-title">Modifier la commission</h3>
  }
  <div class="field">
    <label class="field-label" [attr.for]="id + '-name'">Nom</label>
    <input [id]="id + '-name'" autofocus class="field-control" type="text" formControlName="name" required />
  </div>
  <div class="field">
    <label class="field-label" [attr.for]="id + '-description'">Description</label>
    <textarea [id]="id + '-description'" class="field-control" rows="3" formControlName="description"></textarea>
  </div>
  <app-tone-picker [control]="form.controls.color" legend="Couleur de la commission" />
  @if (error(); as message) {
    <p class="error-message" role="alert">{{ message }}</p>
  }
  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">{{ commission() ? 'Enregistrer' : 'Créer la commission' }}</button>
    <button type="button" class="btn" (click)="done.emit()">Annuler</button>
  </div>
</form>
