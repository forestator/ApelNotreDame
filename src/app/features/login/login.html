<main class="login-page">
  <section class="card login-card">
    <img ngSrc="logo.jpeg" width="220" height="220" alt="APEL Notre-Dame, Montfort-sur-Meu" priority class="login-logo" />
    <h1 class="page-title">Organisation de l'APEL</h1>
    <p class="muted">Dites où vous serez : montages, stands, créneaux à pourvoir.</p>

    <button type="button" class="btn btn-primary" [disabled]="busy()" (click)="signIn()">
      Se connecter avec Google
    </button>

    @if (error(); as message) {
      <p class="error-message" role="alert">{{ message }}</p>
    }
  </section>
</main>
